# Self-hosted Deepgram stack (uneeq-kit) on the miniprem k8s box.
# Companion to scripts/t2-deploy-deepgram.sh (or the docker/allinone compose
# profile). Namespace: deepgram. GPU: shares card 0.
#
# Requires:
#   - harbor pull secret in ns deepgram (robot with access to cr.uneeq.io/deepgram)
#   - /opt/deepgram on the node with models/ + config/ (see DEEPGRAM-LOCAL.md)
#   - outbound HTTPS to license.deepgram.com + model S3 (first boot)
apiVersion: v1
kind: Namespace
metadata:
  name: deepgram
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: deepgram-config
  namespace: deepgram
data:
  DEEPGRAM_TTS_MODEL: "flux-hannah-en"
---
# api (stem) — customer-facing on host :8080
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deepgram-api
  namespace: deepgram
spec:
  replicas: 1
  selector:
    matchLabels: {app: deepgram-api}
  template:
    metadata:
      labels: {app: deepgram-api}
    spec:
      imagePullSecrets:
        - name: harbor
      containers:
        - name: api
          image: cr.uneeq.io/deepgram/api-uneeq:1.192.31-6-gea727c0b2845
          imagePullPolicy: IfNotPresent
          args: ["-v", "serve", "/api.toml"]
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: {name: deepgram-config}
          env:
            - name: DEEPGRAM_API_KEY
              valueFrom:
                secretKeyRef: {name: deepgram-creds, key: api-key}
          volumeMounts:
            - {name: config, mountPath: /api.toml, subPath: api.toml}
      volumes:
        - name: config
          hostPath: {path: /opt/deepgram/config}
---
apiVersion: v1
kind: Service
metadata:
  name: deepgram-api
  namespace: deepgram
spec:
  type: NodePort
  selector: {app: deepgram-api}
  ports:
    - {port: 8080, targetPort: 8080, nodePort: 30080}
---
# STT engine (Nova-3 streaming + Flux)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deepgram-engine-stt
  namespace: deepgram
spec:
  replicas: 1
  selector:
    matchLabels: {app: deepgram-engine-stt}
  template:
    metadata:
      labels: {app: deepgram-engine-stt}
    spec:
      imagePullSecrets:
        - name: harbor
      containers:
        - name: engine
          image: cr.uneeq.io/deepgram/engine-uneeq:3.128.0-35-g32f578ac8bdd
          imagePullPolicy: IfNotPresent
          args: ["-v", "serve", "/engine.toml"]
          env:
            - {name: DEEPGRAM_API_KEY, valueFrom: {secretKeyRef: {name: deepgram-creds, key: api-key}}}
            - {name: CUDA_VISIBLE_DEVICES, value: "0"}
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - {name: models, mountPath: /models}
            - {name: config, mountPath: /engine.toml, subPath: engine-stt.toml}
      volumes:
        - name: models
          hostPath: {path: /opt/deepgram/models-stt}
        - name: config
          hostPath: {path: /opt/deepgram/config}
---
# TTS engine (Flux)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deepgram-engine-tts
  namespace: deepgram
spec:
  replicas: 1
  selector:
    matchLabels: {app: deepgram-engine-tts}
  template:
    metadata:
      labels: {app: deepgram-engine-tts}
    spec:
      imagePullSecrets:
        - name: harbor
      containers:
        - name: engine
          image: cr.uneeq.io/deepgram/engine-uneeq:3.128.0-35-g32f578ac8bdd
          imagePullPolicy: IfNotPresent
          args: ["-v", "serve", "/engine.toml"]
          env:
            - {name: DEEPGRAM_API_KEY, valueFrom: {secretKeyRef: {name: deepgram-creds, key: api-key}}}
            - {name: CUDA_VISIBLE_DEVICES, value: "0"}
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - {name: models, mountPath: /models}
            - {name: config, mountPath: /engine.toml, subPath: engine-tts.toml}
      volumes:
        - name: models
          hostPath: {path: /opt/deepgram/models-tts}
        - name: config
          hostPath: {path: /opt/deepgram/config}
---
# Engine Services — api.toml routes to "https://engine-stt:8080/v2" and
# "https://engine-tts:8080/v2" (vendor compose service names), so the k8s
# Service names MUST be exactly engine-stt / engine-tts for in-namespace DNS.
apiVersion: v1
kind: Service
metadata:
  name: engine-stt
  namespace: deepgram
spec:
  selector: {app: deepgram-engine-stt}
  ports:
    - {port: 8080, targetPort: 8080}
---
apiVersion: v1
kind: Service
metadata:
  name: engine-tts
  namespace: deepgram
spec:
  selector: {app: deepgram-engine-tts}
  ports:
    - {port: 8080, targetPort: 8080}
---
# TTS adapter (BYO v1 -> /v2/speak) — Renny's custom TTS endpoint, host :8086
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deepgram-tts-adapter
  namespace: deepgram
spec:
  replicas: 1
  selector:
    matchLabels: {app: deepgram-tts-adapter}
  template:
    metadata:
      labels: {app: deepgram-tts-adapter}
    spec:
      containers:
        - name: adapter
          image: deepgram-tts-adapter:local
          # built on the node, imported into containerd by the deploy script
          imagePullPolicy: Never
          ports:
            - containerPort: 8086
          env:
            - {name: DEEPGRAM_STEM_URL, value: "http://deepgram-api.deepgram.svc.cluster.local:8080"}
            - {name: DEEPGRAM_TTS_MODEL, valueFrom: {configMapKeyRef: {name: deepgram-config, key: DEEPGRAM_TTS_MODEL}}}
---
apiVersion: v1
kind: Service
metadata:
  name: deepgram-tts-adapter
  namespace: deepgram
spec:
  type: NodePort
  selector: {app: deepgram-tts-adapter}
  ports:
    - {port: 8086, targetPort: 8086, nodePort: 30086}
