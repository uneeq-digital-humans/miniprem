# On every merge to the default branch, ask customer-documentation to decide
# whether the change needs customer-facing docs (docs-sync worker). The whole
# pipeline (gate, generation, PR) lives there; this stub only forwards the
# merge SHAs. See .hermes plans / docs-sync in customer-documentation.
#
# GITHUB_TOKEN is scoped to this repo and cannot dispatch a workflow in
# customer-documentation (the API returns 403 regardless of permissions:).
# The dispatch therefore uses DOCS_SYNC_DISPATCH_TOKEN, an org secret holding
# a fine-grained PAT or GitHub App token with Actions: write on
# customer-documentation only. Until that secret exists the job emits a
# warning annotation and exits cleanly instead of failing every merge.
#
# The dispatch step is continue-on-error so that a window where the secret
# exists but docs-sync.yml is not yet on customer-documentation's default
# branch (or a transient API failure) produces a warning, not a red merge.
#
# A lost dispatch can be replayed by hand via workflow_dispatch; leave the
# inputs empty to re-send the current head. before_sha may be the all-zero
# SHA on a first push or force-push; the worker falls back to AFTER^..AFTER
# whenever the range is unusable, so an empty or bogus before_sha is safe.
name: Docs Sync
on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      before_sha:
        description: Start of the commit range (optional, worker falls back to after_sha^)
        required: false
        default: ""
      after_sha:
        description: End of the commit range (optional, defaults to the current head)
        required: false
        default: ""
permissions:
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Check dispatch token
        id: token
        env:
          TOKEN: ${{ secrets.DOCS_SYNC_DISPATCH_TOKEN }}
        run: |
          if [[ -z "$TOKEN" ]]; then
            echo "::warning::DOCS_SYNC_DISPATCH_TOKEN is not set; docs-sync dispatch skipped"
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Dispatch docs-sync
        id: dispatch
        if: steps.token.outputs.available == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.DOCS_SYNC_DISPATCH_TOKEN }}
          BEFORE: ${{ inputs.before_sha || github.event.before }}
          AFTER: ${{ inputs.after_sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh workflow run docs-sync.yml \
            --repo uneeq-digital-humans/customer-documentation \
            -f source_repo="$GITHUB_REPOSITORY" \
            -f before_sha="$BEFORE" \
            -f after_sha="$AFTER" \
            -f actor="$GITHUB_ACTOR" \
            -f source_run_url="$RUN_URL"
      - name: Report dispatch failure
        if: steps.dispatch.outcome == 'failure'
        run: |
          echo "::warning::docs-sync dispatch to customer-documentation failed; replay via workflow_dispatch once the worker workflow is available"