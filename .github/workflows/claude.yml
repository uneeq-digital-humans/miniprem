name: Claude Code
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
# A reusable workflow can't be granted more than the caller's token scopes,
# and the repo default is read-only. Grant what the marketplace workflow needs.
permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  actions: read
jobs:
  claude:
    uses: uneeq-digital-humans/claude-code-marketplace/.github/workflows/claude.yml@main
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Sovereign AI first: marketplace probes these and responds via
      # UneeQ Dev (Qwen3.8) before falling back to Claude Sonnet.
      UNEEQ_VLLM_ENDPOINT: ${{ secrets.UNEEQ_VLLM_ENDPOINT }}
      UNEEQ_VLLM_KEY: ${{ secrets.UNEEQ_VLLM_KEY }}
